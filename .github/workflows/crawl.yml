name: 편의점 크롤링

on:
  schedule:
    # 매월 1일·15일 09:00 KST (= 00:00 UTC) 실행
    - cron: '0 0 1,15 * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install httpx "beautifulsoup4>=4.12.0" "apscheduler>=3.10.0" "supabase>=2.3.0" playwright python-dotenv

      - name: Playwright Chromium 설치
        run: playwright install chromium --with-deps

      - name: 크롤링 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          python -c "
          import asyncio, logging
          logging.basicConfig(level=logging.INFO, format='%(asctime)s %(levelname)s %(name)s %(message)s')
          from crawler.use_cases.crawl_all import crawl_all_stores

          async def main():
              results = await crawl_all_stores()
              for r in results:
                  if r.error:
                      print(f'[실패] {r.store}: {r.error}')
                  else:
                      print(f'[성공] {r.store}: {len(r.products)}개')

          asyncio.run(main())
          "
