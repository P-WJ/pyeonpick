name: Supabase keep-alive

# Supabase 무료 플랜은 약 1주일간 활동이 없으면 프로젝트를 일시정지한다.
# 정지되면 프로젝트 도메인 DNS가 사라져 크롤러가 `Name or service not known`으로 실패한다
# (2026-09-15 ~ 10-15 세 회차 전부 이 원인). 주 2회 가벼운 조회로 활동을 남긴다.

on:
  schedule:
    # 매주 월·목 09:00 KST (= 00:00 UTC)
    - cron: '0 0 * * 1,4'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Supabase 조회
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 30 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/rest/v1/products?select=id&limit=1"
          echo
          echo "Supabase 응답 정상"
